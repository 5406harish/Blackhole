<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Hole</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><span class="brand-icon">💊</span><div><h1>Capsule</h1><p>Your browser workspaces</p></div></div>
      <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <section class="toolbar">
      <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Search capsules..." autocomplete="off"></label>
      <div class="actions">
        <button id="newCapsuleBtn" class="primary">＋ New Capsule</button>
        <button id="saveTabsBtn" class="secondary">Save Current Tabs</button>
        <button id="saveCloseBtn" class="secondary">Save &amp; Close</button>
      </div>
    </section>

    <section class="section-title"><h2>MY CAPSULES</h2><span id="capsuleCount"></span></section>
    <section id="capsules" class="capsules" aria-live="polite"></section>
  </main>

  <dialog id="capsuleDialog" class="dialog">
    <form id="capsuleForm" method="dialog">
      <div class="dialog-head"><div><h2 id="dialogTitle">Create Capsule</h2><p>Give this workspace a recognizable identity.</p></div><button type="button" class="icon-btn" data-close-dialog>×</button></div>
      <label>Capsule Name<input id="capsuleName" maxlength="80" required placeholder="e.g. Placement Preparation"></label>
      <label>Description<textarea id="capsuleDescription" maxlength="180" rows="3" placeholder="What is this workspace for?"></textarea></label>
      <div class="two-col"><label>Icon<input id="capsuleIcon" maxlength="4" value="💊"></label><label>Color<input id="capsuleColor" type="color" value="#6366f1"></label></div>
      <div class="dialog-actions"><button type="button" class="secondary" data-close-dialog>Cancel</button><button class="primary" type="submit">Create Capsule</button></div>
    </form>
  </dialog>

  <dialog id="websiteDialog" class="dialog wide">
    <form id="websiteForm" method="dialog">
      <div class="dialog-head"><div><h2 id="websiteDialogTitle">Edit Websites</h2><p>Drag items to reorder them.</p></div><button type="button" class="icon-btn" data-close-dialog>×</button></div>
      <div id="websiteList" class="website-list"></div>
      <div class="dialog-actions"><button type="button" class="secondary" data-close-dialog>Done</button></div>
    </form>
  </dialog>

  <dialog id="addTabDialog" class="dialog">
    <form id="addTabForm" method="dialog">
      <div class="dialog-head"><div><h2>Add Current Tab</h2><p>Select the capsule that should receive the active tab.</p></div><button type="button" class="icon-btn" data-close-dialog>×</button></div>
      <div id="addTabOptions" class="radio-list"></div>
      <div class="dialog-actions"><button type="button" class="secondary" data-close-dialog>Cancel</button><button class="primary">Add Tab</button></div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="dialog">
    <form id="confirmForm" method="dialog"><div class="dialog-head"><div><h2 id="confirmTitle">Confirm</h2><p id="confirmText"></p></div><button type="button" class="icon-btn" data-close-dialog>×</button></div><div class="dialog-actions"><button type="button" class="secondary" data-close-dialog>Cancel</button><button id="confirmAction" class="danger">Delete</button></div></form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
